[package]
name = "clash-flow-manager"
version = "0.1.0"
description = "Clash 订阅与流量管理"
authors = ["Tinderbox"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "socks"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "net"] }
zstd = "0.13"
sha2 = "0.10"
base64 = "0.22"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
