[package]
name = "xgif-convert-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "X 媒体工坊 GIF/WebP 转换流水线 Rust 原型（移植 electron/lib/gif.cjs 核心）"
license = "UNLICENSED"
publish = false

[lib]
name = "xgif_convert_poc"
path = "src/lib.rs"

[[bin]]
name = "xgif-convert-poc"
path = "src/main.rs"

# 零外部依赖：仅用 std，便于在离线 / 受限环境直接构建，也方便主 Tauri 后端按需拆分成模块
[dependencies]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
