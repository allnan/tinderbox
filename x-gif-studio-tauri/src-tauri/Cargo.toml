[package]
name = "xmedia-studio-tauri"
version = "1.0.0"
description = "X 媒体工坊 Tauri 完整功能版"
authors = ["X 媒体工坊"]
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "sync", "time", "macros"] }
flate2 = "1"
winreg = "0.55"
rfd = "0.15"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
